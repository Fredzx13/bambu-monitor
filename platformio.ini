; Bambu Monitor - Guition JC4827W543 (ESP32-S3 4.3" 480x272, NV3041A QSPI + GT911)
; Deux variantes selon le type de PSRAM de la carte :
;   jc4827w543       -> PSRAM octale (ESP32-S3-WROOM-1 N4R8)  [par défaut]
;   jc4827w543_quad  -> PSRAM quad   (ESP32-S3-WROOM-1 N4R2 / N16R2...)

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DU8G2_FONT_SUPPORT
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    moononournil/GFX Library for Arduino
    olikraus/U8g2
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0

[env:jc4827w543]
board_build.arduino.memory_type = qio_opi

[env:jc4827w543_quad]
board_build.arduino.memory_type = qio_qspi
